name: benchpromos-development

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: bench_dev
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: benchpromos_dev
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench_dev -d benchpromos_dev"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres_data:
